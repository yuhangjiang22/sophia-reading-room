name: Deploy first edition

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require full-text review for every published article
        run: python3 scripts/check-full-text-publication.py
      - uses: actions/configure-pages@v5
      - name: Assemble a minimal public site
        run: |
          mkdir -p _site/assets
          cp index.html style.css edition.js english.js papers.js publication.js app.js auth.js _site/
          cp assets/favicon.svg assets/conger-character-v1.jpg _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
